server.port=8083
spring.application.name=API-GATEWAY
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
#eureka.instance.hostname=localhost
#routes  configuration
eureka.instance.hostname=qc-dev.ethosh.net
eureka.client.serviceUrl.defaultZone=http://qc-dev.ethosh.net:8761/eureka/

#routes  configuration

spring.cloud.gateway.routes[0].id=QC-SERVICE
spring.cloud.gateway.routes[0].uri=lb://QC-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/qc/**
spring.cloud.gateway.routes[0].filters=AuthenticationFilter

spring.cloud.gateway.routes[1].id=IDENTITY-SERVICE
spring.cloud.gateway.routes[1].uri=lb://IDENTITY-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/identity/**
spring.cloud.gateway.routes[1].filters=AuthenticationFilter

spring.cloud.gateway.routes[2].id=PRODUCTION-ORDER-SERVICE
spring.cloud.gateway.routes[2].uri=lb://PRODUCTION-ORDER-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/prodorder/**
spring.cloud.gateway.routes[2].filters=AuthenticationFilter