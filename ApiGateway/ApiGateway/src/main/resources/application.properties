server.port=8083
spring.application.name=API-GATEWAY
eureka.instance.client.serverUrl.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
#routes  configuration

spring.cloud.gateway.routes[0].id=QUIZ-SERVICE
spring.cloud.gateway.routes[0].uri=lb://QUIZ-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path= /quiz/**, /quiz-test/**
spring.cloud.gateway.routes[0].filters=AuthenticationFilter


spring.cloud.gateway.routes[1].id=QUESTION-SERVICE
spring.cloud.gateway.routes[1].uri=lb://QUESTION-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path= /question/**
spring.cloud.gateway.routes[1].filters=AuthenticationFilter

spring.cloud.gateway.routes[2].id=IDENTITY-SERVICE
spring.cloud.gateway.routes[2].uri=lb://IDENTITY-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path= /auth/**

spring.cloud.gateway.routes[3].id=IDENTITY-SERVICE
spring.cloud.gateway.routes[3].uri=lb://IDENTITY-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path= /users/**, /authorities/**, /auth-types/**, /projects/**, /applications/**, /notification-types-master/**, /contacts/**, /countries/**, /app-fun-types/**, /app-functions/**, /service-providers/**, /notification-tech-details/**, /notification-types/**, /auth-types-master/**, /devices/**, /media/**

# ? QC SERVICE ROUTE
spring.cloud.gateway.routes[4].id=QC-SERVICE
spring.cloud.gateway.routes[4].uri=lb://QC-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/qc/**, /products/**, /product-descriptions/**
